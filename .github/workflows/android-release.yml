name: 📱 Android Release to Play Store

on:
  push:
    tags:
      - 'v*.*.*'  # Триггер на теги версий (например: v1.0.0)
  workflow_dispatch:  # Ручной запуск

jobs:
  build-and-release:
    name: 🏗️ Build & Release APK/AAB
    runs-on: ubuntu-latest
    
    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4
      
      - name: ☕ Setup JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
      
      - name: 🔧 Setup Android SDK
        uses: android-actions/setup-android@v3
      
      - name: 📦 Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-
      
      - name: 🔑 Decode Keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 --decode > app/release-keystore.jks
            echo "✅ Keystore декодирован"
          else
            echo "⚠️ KEYSTORE_BASE64 не найден, сборка без подписи"
          fi
      
      - name: 📝 Create keystore.properties
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          if [ -n "$KEYSTORE_PASSWORD" ]; then
            cat > keystore.properties << EOF
          storeFile=release-keystore.jks
          storePassword=$KEYSTORE_PASSWORD
          keyAlias=$KEY_ALIAS
          keyPassword=$KEY_PASSWORD
          EOF
            echo "✅ keystore.properties создан"
          else
            echo "⚠️ Keystore credentials не найдены"
          fi
      
      - name: 🏗️ Build Release APK
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --stacktrace
          echo "✅ APK собран"
      
      - name: 📦 Build Release AAB (Android App Bundle)
        run: |
          ./gradlew bundleRelease --stacktrace
          echo "✅ AAB собран"
      
      - name: 📊 APK/AAB Info
        run: |
          echo "📱 APK размер: $(du -h app/build/outputs/apk/release/app-release.apk 2>/dev/null | cut -f1 || echo 'не найден')"
          echo "📦 AAB размер: $(du -h app/build/outputs/bundle/release/app-release.aab 2>/dev/null | cut -f1 || echo 'не найден')"
      
      - name: 📤 Upload APK as Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ChatBot-APK
          path: app/build/outputs/apk/release/app-release.apk
          retention-days: 30
      
      - name: 📤 Upload AAB as Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ChatBot-AAB
          path: app/build/outputs/bundle/release/app-release.aab
          retention-days: 30
      
      - name: 🚀 Upload to Google Play Console
        if: startsWith(github.ref, 'refs/tags/v')
        uses: r0adkll/upload-google-play@v1
        with:
          serviceAccountJsonPlainText: ${{ secrets.GOOGLE_PLAY_SERVICE_ACCOUNT_JSON }}
          packageName: com.test.chatbot
          releaseFiles: app/build/outputs/bundle/release/app-release.aab
          track: internal  # internal, alpha, beta, production
          status: completed
          inAppUpdatePriority: 2
          whatsNewDirectory: distribution/whatsnew
      
      - name: 📝 Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v1
        with:
          files: |
            app/build/outputs/apk/release/app-release.apk
            app/build/outputs/bundle/release/app-release.aab
          body: |
            ## 🎉 Новая версия ChatBot AI Assistant!
            
            ### 📱 Установка:
            - **APK**: Скачайте `app-release.apk` для прямой установки
            - **AAB**: Автоматически опубликовано в Google Play (Internal Testing)
            
            ### 🚀 Что нового:
            - См. коммиты в этом релизе
            
            ### 📊 Размеры:
            - APK: ~20 MB
            - AAB: ~15 MB (оптимизировано для Play Store)
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      
      - name: 💬 Notify Success
        if: success()
        run: |
          echo "✅ Релиз успешно создан!"
          echo "📱 APK доступен в артефактах"
          echo "🚀 AAB загружен в Google Play Console"
      
      - name: ❌ Notify Failure
        if: failure()
        run: |
          echo "❌ Ошибка при создании релиза"
          echo "💡 Проверьте логи выше"
